name: Agent Team standard case

# One real-model `dsh --profile headless` run per standard case, each a fixed
# Agent Team task, then an analysis of its trajectory and result
# (`pnpm run standard-case`; scripts/standard-case/case.ts is the standard a
# case implements). It runs only when a maintainer dispatches it, on the ref
# they choose, so comparing the summaries of two runs shows how the code
# between them changed the Team's behavior. The run is an observation, not a
# gate: the job fails only when a case could not be run or analyzed, never on
# the rubric, since one model run varies.
#
# A dispatch that names no case runs the cases of cadence `default`. A dispatch
# that names cases runs exactly those, inside the OpenROAD flow image, which is
# where the cases of cadence `named` find their tools.
#
# The model key is the repository secret OPENROUTER_API_KEY. Without it the job
# reports that it was skipped. The model and reasoning effort are fixed in
# scripts/standard-case/run.ts. Repository variables STANDARD_CASE_PROVIDER,
# STANDARD_CASE_ROUTE, and STANDARD_CASE_MODEL_SPEC override where the model is
# reached.
#
# SECURITY: keep `workflow_dispatch` the only trigger. This workflow runs the
# checked-out code with the model key, so it may only run a ref a maintainer
# chose; a `pull_request` or `pull_request_target` trigger would run code the
# maintainers have not accepted.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Case names separated by spaces; empty runs the cases of cadence default.
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  default-cases:
    name: default cases
    if: inputs.cases == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check for the model key
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: the repository secret OPENROUTER_API_KEY is not set."
            echo "Skipped: the repository secret \`OPENROUTER_API_KEY\` is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run and analyze the default cases
        if: steps.key.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STANDARD_CASE_PROVIDER: ${{ vars.STANDARD_CASE_PROVIDER }}
          STANDARD_CASE_ROUTE: ${{ vars.STANDARD_CASE_ROUTE }}
          STANDARD_CASE_MODEL_SPEC: ${{ vars.STANDARD_CASE_MODEL_SPEC }}
        run: pnpm run standard-case --cadence default --out "$RUNNER_TEMP/standard-case"

      - name: Upload the run
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: standard-case-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/standard-case
            !${{ runner.temp }}/standard-case/*/dsh-home/tmp
            !${{ runner.temp }}/standard-case/*/dsh-home/profiles
            !${{ runner.temp }}/standard-case/*/dsh-home/storages

  # The image carries yosys, openroad, and the open platforms; a named case
  # that needs none of them runs there just the same.
  named-cases:
    name: named cases
    if: inputs.cases != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: openroad/orfs:latest
    steps:
      - name: Check for the model key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::The repository secret OPENROUTER_API_KEY is not set."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Prepare the image
        run: bash scripts/standard-case/orfs-setup.sh

      - name: Install (immutable)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run and analyze the named cases
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STANDARD_CASE_PROVIDER: ${{ vars.STANDARD_CASE_PROVIDER }}
          STANDARD_CASE_ROUTE: ${{ vars.STANDARD_CASE_ROUTE }}
          STANDARD_CASE_MODEL_SPEC: ${{ vars.STANDARD_CASE_MODEL_SPEC }}
          CASES: ${{ inputs.cases }}
        run: |
          source /tmp/orfs-env.sh
          # The input reaches a shell: accept only case names separated by spaces.
          if ! [[ "$CASES" =~ ^[a-z0-9-]+(\ [a-z0-9-]+)*$ ]]; then
            echo "::error::cases must be case names separated by single spaces"
            exit 2
          fi
          # shellcheck disable=SC2086 -- validated above as a space-separated list of case names.
          pnpm run standard-case $CASES --out "$RUNNER_TEMP/standard-case"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-case-named-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/standard-case
            !${{ runner.temp }}/standard-case/*/dsh-home/tmp
            !${{ runner.temp }}/standard-case/*/dsh-home/profiles
            !${{ runner.temp }}/standard-case/*/dsh-home/storages
