name: Agent Team standard case

# One real-model `dsh --profile headless` run per standard case, each a fixed
# Agent Team task, then an analysis of its trajectory and result
# (`pnpm run standard-case`; scripts/standard-case/case.ts is the standard a
# case implements). It runs
# after every push to master, so the summary of consecutive runs shows how a
# merge changed the Team's behavior. The run is an observation, not a gate: the
# job fails only when the case could not be run or analyzed, never on the
# rubric, since one model run varies.
#
# The model key is the repository secret OPENROUTER_API_KEY. Without it the job
# reports that it was skipped. The model and reasoning effort are fixed in
# scripts/standard-case/run.ts. Repository variables STANDARD_CASE_PROVIDER,
# STANDARD_CASE_ROUTE, STANDARD_CASE_MODEL_SPEC, and STANDARD_CASE_DEADLINE_MS
# override where the model is reached and the run's time limit.
#
# SECURITY: never add a `pull_request_target` trigger. This workflow runs the
# checked-out code with the model key, so it may only run code already on
# master or a ref a maintainer dispatches.
on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  standard-case:
    name: standard case
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check for the model key
        id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: the repository secret OPENROUTER_API_KEY is not set."
            echo "Skipped: the repository secret \`OPENROUTER_API_KEY\` is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v6
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run and analyze the standard case
        if: steps.key.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STANDARD_CASE_PROVIDER: ${{ vars.STANDARD_CASE_PROVIDER }}
          STANDARD_CASE_ROUTE: ${{ vars.STANDARD_CASE_ROUTE }}
          STANDARD_CASE_MODEL_SPEC: ${{ vars.STANDARD_CASE_MODEL_SPEC }}
          STANDARD_CASE_DEADLINE_MS: ${{ vars.STANDARD_CASE_DEADLINE_MS }}
        run: pnpm run standard-case --out "$RUNNER_TEMP/standard-case"

      - name: Upload the run
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: standard-case-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/standard-case
            !${{ runner.temp }}/standard-case/*/dsh-home/tmp
            !${{ runner.temp }}/standard-case/*/dsh-home/profiles
            !${{ runner.temp }}/standard-case/*/dsh-home/storages
